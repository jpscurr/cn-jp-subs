<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>字幕生成器</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>字</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="glyph" id="brand-glyph">字</span>
    <div>
      <h1>字幕生成器</h1>
      <p id="brand-sub">给 asbplayer 用的字幕</p>
    </div>
  </div>
  <div class="langs" id="langs" role="group" aria-label="语言"></div>
  <div class="health" id="health"></div>
  <button class="ghost" id="settings-open">设置</button>
</header>

<main>
  <section class="card compose">
    <label class="field-label" for="urls">YouTube 链接</label>
    <textarea id="urls" rows="3" spellcheck="false"
      placeholder="粘贴一个或多个 YouTube 链接，播放列表也可以。按 Ctrl+Enter 开始。"></textarea>

    <div class="compose-row">
      <div class="toggles">
        <label class="chk"><input type="checkbox" id="opt-existing"> <span>优先用视频自带字幕</span></label>
        <label class="chk"><input type="checkbox" id="opt-auto"> <span>接受自动生成的字幕</span></label>
        <label class="chk"><input type="checkbox" id="opt-reading"> <span id="opt-reading-label">拼音行</span></label>
        <label class="chk"><input type="checkbox" id="opt-translate"> <span>英文行</span></label>
      </div>
      <div class="compose-actions">
        <select id="opt-model" class="mini" title="Whisper 模型"></select>
        <button class="primary" id="go">开始生成</button>
      </div>
    </div>
    <p class="hint" id="compose-hint"></p>
  </section>

  <div class="columns">
    <section class="card queue-card">
      <div class="card-head">
        <h2>队列</h2>
        <button class="ghost small" id="clear-done">清除已完成</button>
      </div>
      <div id="queue" class="queue"></div>
      <p class="empty" id="queue-empty">队列里还什么都没有。</p>
    </section>

    <section class="card files-card">
      <div class="card-head">
        <h2>输出</h2>
        <button class="ghost small" id="open-folder">打开文件夹</button>
      </div>
      <ul id="files" class="files"></ul>
      <p class="empty" id="files-empty">还没有生成任何字幕文件。</p>
    </section>
  </div>
</main>

<div class="overlay" id="preview-overlay" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="preview-title">预览</h2>
      <button class="ghost small" id="preview-close">关闭</button>
    </div>
    <p class="path" id="preview-path"></p>
    <div class="cues" id="preview-cues"></div>
  </div>
</div>

<div class="overlay" id="settings-overlay" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <h2>设置</h2>
      <button class="ghost small" id="settings-close">关闭</button>
    </div>

    <div class="settings-grid">
      <label>Groq API 密钥
        <input type="password" id="set-key" placeholder="留空则保持现有密钥" autocomplete="off">
        <small id="key-note"></small>
      </label>
      <label>并发上传数
        <input type="number" id="set-parallel" min="1" max="8">
        <small>同时进行的转写请求数。想快就调大，遇到限流就调小。</small>
      </label>
      <label class="wide">输出目录 <em id="set-out-lang"></em>
        <input type="text" id="set-out">
        <small>每种语言各有各的目录，视频不会混在一起。</small>
      </label>
      <label>Whisper 模型
        <select id="set-model"></select>
        <small>large-v3 更准；turbo 快约四倍、也更便宜。</small>
      </label>
      <label>翻译模型
        <select id="set-translate-model"></select>
      </label>
      <label id="row-variant">字形
        <select id="set-variant">
          <option value="s">简体</option>
          <option value="t">繁體</option>
          <option value="">保持原样</option>
        </select>
      </label>
      <label id="row-reading-style">注音方式
        <select id="set-reading-style"></select>
      </label>
      <label>每行最多字数
        <input type="number" id="set-chars" min="10" max="60">
      </label>
      <label>每段长度（秒）
        <input type="number" id="set-chunk" min="120" max="1500" step="60">
        <small>每次请求发送的音频长度。上传老是超时就调小。</small>
      </label>
      <label class="wide">Whisper 提示词 <em id="set-prompt-lang"></em>
        <textarea id="set-prompt" rows="2"></textarea>
        <small>引导转写走向正确的语言，并使用正常标点。</small>
      </label>
    </div>

    <div class="sheet-foot">
      <span class="hint" id="settings-hint"></span>
      <button class="primary" id="settings-save">保存</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
